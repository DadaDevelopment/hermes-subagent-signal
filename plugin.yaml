name: subagent-signal
version: 0.3.0
description: "Durable wake layer: stalled-/loop recovery watchdog, subagent checkpoints (child->parent), signed external wake webhooks, schedule_wakeup/sleep_until_event/fire_event."
author: DadaDevelopment
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - subagent_checkpoint
  - read_subagent_checkpoints
  - create_wakeup_hook
  - list_wakeup_hooks
  - revoke_wakeup_hook
  - schedule_wakeup
  - sleep_until_event
  - fire_event
  - cancel_pending
